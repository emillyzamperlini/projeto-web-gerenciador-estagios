<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Gerenciador de Estágios</title>
        <meta charset="UTF-8">
    </head>
    <body>

    <div class="container">
            <div th:if="${sucesso}" class="alert alert-success" role="alert">
                <span th:text="${sucesso}"></span>
            </div>
            <div th:if="${erro}" class="alert alert-danger" role="alert">
            <span th:text="${erro}"></span>
        </div>

            <div class="header">
            <h1>Estágios Cadastrados</h1>
            <p>Gerencie e acompanhe seus estágios</p>
        </div>
        <a class="btn btn-primary btn-cadastrar" href="/estagios/novo">
            + Cadastrar estágio
        </a>

        <form class="search-form" action="/estagios/pesquisar" method="get">
            <input class = "form-control" type ="text" name="empresa" placeholder="Digite a empresa">
            <button class ="btn btn-primary" type = "submit">Pesquisar</button>
        </form>

        <div class="ordenacao">
            <a href="/estagios/ordenar/crescente">Data mais antiga</a>
            <a href="/estagios/ordenar/decrescente">Data mais recente</a>
        </div>

        <div class="table-card">

            <table class = "table">
                <tr class="table-light">
                    <th>Empresa</th>
                    <th>Cargo</th>
                    <th>Data Início</th>
                    <th>Data Fim</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="estagio : ${estagios}">
                    <td th:text="${estagio.empresa}"></td>
                    <td th:text="${estagio.cargo}"></td>
                    <td th:text="${estagio.dataInicio}"></td>
                    <td th:text="${estagio.dataFim}"></td>

                    <td>
                        <span class="status" th:text="${estagio.status}"></span>
                    </td>

                    <td class="acoes">
                        <a class="btn btn-editar"
                           th:href="@{/estagios/editar/{id}(id=${estagio.id})}">
                            Editar
                        </a>

                        <a class="btn btn-excluir"
                           th:href="@{/estagios/excluir/{id}(id=${estagio.id})}">
                            Excluir
                        </a>
                    </td>
                </tr>

            </table>

        </div>

    </div>

    </body>
</html>
